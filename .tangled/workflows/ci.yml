when:
  - event: ["push", "manual"]
    branch: ["main"]

  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: alpine

steps:
  - name: "Install dependencies"
    command: |
      sudo apk add curl jq tar gzip gcompat

  - name: "Install Roc nightly"
    command: |
      ./ci/install-roc.sh

  - name: "Check Hana"
    command: |
      export PATH="$PWD/.roc:$PATH"
      ./ci/all_tests.sh
